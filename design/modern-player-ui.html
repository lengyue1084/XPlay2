<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:,">
  <title>XPlay2 Modern Player Concept</title>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #0c0e11;
      --panel: #14171b;
      --panel-2: #191d22;
      --line: #2a2f36;
      --muted: #8e959f;
      --text: #f4f6f8;
      --accent: #ff5a4f;
      --teal: #42c6b7;
    }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      background: #090a0c;
      color: var(--text);
      font-family: "Segoe UI", "Microsoft YaHei UI", sans-serif;
      font-size: 14px;
      letter-spacing: 0;
      display: grid;
      place-items: center;
    }
    button { font: inherit; color: inherit; }
    .window {
      width: 1400px;
      height: 860px;
      background: var(--bg);
      border: 1px solid #30343a;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 30px 80px rgba(0,0,0,.48);
      display: grid;
      grid-template-columns: 68px minmax(0, 1fr) 316px;
      grid-template-rows: 58px minmax(0, 1fr);
    }
    .titlebar {
      grid-column: 1 / -1;
      display: flex;
      align-items: center;
      border-bottom: 1px solid var(--line);
      background: #111317;
      padding: 0 14px 0 20px;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 250px; font-weight: 650; }
    .brand-mark {
      width: 27px; height: 27px; border-radius: 6px; background: var(--accent);
      display: grid; place-items: center; color: white;
    }
    .brand-mark i { width: 15px; height: 15px; fill: currentColor; }
    .brand-name { font-size: 16px; }
    .now-title { flex: 1; text-align: center; color: #c6cbd1; font-size: 13px; }
    .window-actions { display: flex; margin-left: auto; gap: 2px; }
    .window-actions span { width: 36px; height: 32px; display: grid; place-items: center; color: #90969e; border-radius: 4px; }
    .window-actions i { width: 15px; height: 15px; }
    .window-actions .close:hover { background: #c42b1c; color: white; }

    .rail {
      grid-row: 2; border-right: 1px solid var(--line); background: #111317;
      display: flex; flex-direction: column; align-items: center; padding: 16px 0;
    }
    .rail-btn {
      width: 42px; height: 42px; border: 0; background: transparent; border-radius: 6px;
      display: grid; place-items: center; color: #858c95; margin-bottom: 8px; position: relative;
    }
    .rail-btn i { width: 19px; height: 19px; }
    .rail-btn.active { color: white; background: #252a30; }
    .rail-btn.active::before { content: ""; position: absolute; left: -13px; width: 3px; height: 22px; border-radius: 2px; background: var(--accent); }
    .rail-spacer { flex: 1; }
    .avatar { width: 32px; height: 32px; border-radius: 50%; background: #d8d4ca; color: #25282c; display: grid; place-items: center; font-size: 12px; font-weight: 700; }

    .main { grid-column: 2; grid-row: 2; min-width: 0; display: grid; grid-template-rows: minmax(0,1fr) 166px; background: #08090b; }
    .video {
      position: relative; overflow: hidden; margin: 16px 16px 0;
      background: #040506 url("player-scene.jpg") center/cover no-repeat;
      border-radius: 5px 5px 0 0;
    }
    .video::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(3,5,8,.08) 55%, rgba(4,6,8,.70)); }
    .video-meta { position: absolute; z-index: 2; top: 18px; left: 20px; display: flex; gap: 8px; }
    .quality { background: rgba(8,10,12,.75); border: 1px solid rgba(255,255,255,.18); border-radius: 4px; padding: 5px 7px; font-size: 11px; font-weight: 700; }
    .audio-pill { display: flex; align-items: center; gap: 6px; background: rgba(8,10,12,.75); border-radius: 4px; padding: 5px 8px; color: #dce0e4; font-size: 11px; }
    .audio-pill i { width: 13px; height: 13px; color: var(--teal); }
    .caption { position: absolute; z-index: 2; left: 50%; bottom: 30px; transform: translateX(-50%); background: rgba(5,6,8,.72); border-radius: 4px; padding: 8px 12px; font-size: 15px; white-space: nowrap; }

    .controls { padding: 18px 22px 20px; background: var(--panel); border-top: 1px solid #20242a; }
    .timeline { display: grid; grid-template-columns: 52px minmax(0, 1fr) 52px; align-items: center; gap: 12px; color: #aab0b8; font-variant-numeric: tabular-nums; font-size: 12px; }
    .time-end { text-align: right; }
    .track { height: 16px; display: flex; align-items: center; position: relative; }
    .track-bg { width: 100%; height: 4px; border-radius: 2px; background: #3a3f46; overflow: hidden; }
    .track-fill { width: 42%; height: 100%; background: var(--accent); }
    .thumb { position: absolute; left: calc(42% - 6px); width: 12px; height: 12px; border-radius: 50%; background: white; box-shadow: 0 0 0 4px rgba(255,90,79,.18); }
    .control-row { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; margin-top: 16px; min-height: 52px; }
    .left-actions, .right-actions, .transport { display: flex; align-items: center; }
    .right-actions { justify-content: flex-end; gap: 5px; }
    .left-actions { gap: 8px; }
    .transport { gap: 14px; }
    .icon-btn { width: 38px; height: 38px; border: 0; border-radius: 5px; background: transparent; color: #d2d6db; display: grid; place-items: center; }
    .icon-btn i { width: 20px; height: 20px; }
    .icon-btn.subtle { color: #9299a2; }
    .play { width: 52px; height: 52px; border: 0; border-radius: 50%; background: white; color: #111318; display: grid; place-items: center; box-shadow: 0 7px 18px rgba(0,0,0,.25); }
    .play i { width: 23px; height: 23px; fill: currentColor; margin-left: 2px; }
    .volume { width: 78px; height: 4px; border-radius: 2px; background: #383e45; overflow: hidden; margin-left: 2px; }
    .volume span { display: block; width: 68%; height: 100%; background: var(--teal); }
    .speed { min-width: 42px; height: 30px; display: grid; place-items: center; color: #aeb4bb; font-size: 12px; border: 1px solid #343941; border-radius: 4px; }

    .queue { grid-column: 3; grid-row: 2; border-left: 1px solid var(--line); background: var(--panel); display: flex; flex-direction: column; min-width: 0; }
    .queue-head { height: 70px; flex: none; display: flex; align-items: center; padding: 0 18px; border-bottom: 1px solid var(--line); }
    .queue-title { font-size: 15px; font-weight: 650; }
    .queue-count { color: var(--muted); font-size: 12px; margin-left: 8px; }
    .queue-head button { margin-left: auto; }
    .queue-list { padding: 10px 8px; overflow: hidden; }
    .item { height: 82px; display: grid; grid-template-columns: 94px minmax(0, 1fr) 24px; gap: 11px; align-items: center; padding: 8px; border-radius: 6px; color: #cdd1d6; }
    .item + .item { margin-top: 4px; }
    .item.active { background: #252a30; }
    .thumb-img { height: 58px; border-radius: 4px; background-size: cover; background-position: center; position: relative; overflow: hidden; }
    .thumb-img.one { background-image: url("player-scene.jpg"); }
    .thumb-img.two { background: linear-gradient(145deg, #76887a, #26372e 70%); }
    .thumb-img.three { background: linear-gradient(145deg, #c5a06f, #493326 70%); }
    .thumb-img.four { background: linear-gradient(145deg, #7698a8, #202f3b 70%); }
    .duration { position: absolute; right: 4px; bottom: 4px; background: rgba(0,0,0,.72); border-radius: 3px; padding: 2px 4px; font-size: 10px; }
    .item-copy { min-width: 0; }
    .item-name { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .item-sub { color: #848b94; font-size: 11px; margin-top: 7px; }
    .playing { color: var(--accent); display: flex; align-items: center; gap: 5px; }
    .bars { display: flex; align-items: flex-end; gap: 2px; height: 12px; }
    .bars span { width: 2px; background: var(--accent); border-radius: 1px; }
    .bars span:nth-child(1) { height: 7px; } .bars span:nth-child(2) { height: 12px; } .bars span:nth-child(3) { height: 9px; }
    .more { color: #747b84; display: grid; place-items: center; }
    .more i { width: 16px; height: 16px; }
    .queue-foot { margin-top: auto; padding: 15px 16px; border-top: 1px solid var(--line); display: flex; align-items: center; color: #8d949d; font-size: 12px; }
    .queue-foot i { width: 15px; height: 15px; margin-right: 8px; color: var(--teal); }
    .add-btn { margin-left: auto; border: 1px solid #353a42; background: #20242a; border-radius: 5px; height: 32px; padding: 0 11px; display: flex; align-items: center; gap: 6px; font-size: 12px; }
    .add-btn i { width: 14px; height: 14px; margin: 0; color: white; }
  </style>
</head>
<body>
  <section class="window" aria-label="XPlay2 现代播放器设计稿">
    <header class="titlebar">
      <div class="brand"><span class="brand-mark"><i data-lucide="play"></i></span><span class="brand-name">XPlay2</span></div>
      <div class="now-title">城市漫游 · 夜色篇</div>
      <div class="window-actions"><span><i data-lucide="minus"></i></span><span><i data-lucide="square"></i></span><span class="close"><i data-lucide="x"></i></span></div>
    </header>

    <nav class="rail">
      <button class="rail-btn active" title="正在播放"><i data-lucide="play-circle"></i></button>
      <button class="rail-btn" title="媒体库"><i data-lucide="library"></i></button>
      <button class="rail-btn" title="播放历史"><i data-lucide="history"></i></button>
      <button class="rail-btn" title="收藏"><i data-lucide="heart"></i></button>
      <div class="rail-spacer"></div>
      <button class="rail-btn" title="设置"><i data-lucide="settings-2"></i></button>
      <div class="avatar">XP</div>
    </nav>

    <main class="main">
      <div class="video">
        <div class="video-meta"><span class="quality">4K</span><span class="audio-pill"><i data-lucide="audio-lines"></i>DTS 5.1</span></div>
        <div class="caption">在每一盏灯亮起之前，城市已经开始呼吸。</div>
      </div>
      <div class="controls">
        <div class="timeline"><span>18:42</span><div class="track"><div class="track-bg"><div class="track-fill"></div></div><span class="thumb"></span></div><span class="time-end">44:18</span></div>
        <div class="control-row">
          <div class="left-actions"><button class="icon-btn"><i data-lucide="volume-2"></i></button><div class="volume"><span></span></div></div>
          <div class="transport"><button class="icon-btn subtle"><i data-lucide="shuffle"></i></button><button class="icon-btn"><i data-lucide="skip-back"></i></button><button class="play"><i data-lucide="play"></i></button><button class="icon-btn"><i data-lucide="skip-forward"></i></button><button class="icon-btn subtle"><i data-lucide="repeat-2"></i></button></div>
          <div class="right-actions"><span class="speed">1.0×</span><button class="icon-btn"><i data-lucide="captions"></i></button><button class="icon-btn"><i data-lucide="picture-in-picture-2"></i></button><button class="icon-btn"><i data-lucide="maximize"></i></button></div>
        </div>
      </div>
    </main>

    <aside class="queue">
      <div class="queue-head"><span class="queue-title">播放队列</span><span class="queue-count">4 个视频</span><button class="icon-btn"><i data-lucide="panel-right-close"></i></button></div>
      <div class="queue-list">
        <div class="item active"><div class="thumb-img one"><span class="duration">44:18</span></div><div class="item-copy"><div class="item-name">城市漫游 · 夜色篇</div><div class="item-sub playing"><span class="bars"><span></span><span></span><span></span></span>正在播放</div></div><span class="more"><i data-lucide="more-vertical"></i></span></div>
        <div class="item"><div class="thumb-img two"><span class="duration">26:09</span></div><div class="item-copy"><div class="item-name">森林里的清晨</div><div class="item-sub">纪录片 · 4K</div></div><span class="more"><i data-lucide="more-vertical"></i></span></div>
        <div class="item"><div class="thumb-img three"><span class="duration">31:52</span></div><div class="item-copy"><div class="item-name">沿海公路旅行</div><div class="item-sub">旅行 · 1080P</div></div><span class="more"><i data-lucide="more-vertical"></i></span></div>
        <div class="item"><div class="thumb-img four"><span class="duration">12:35</span></div><div class="item-copy"><div class="item-name">雨后的港口</div><div class="item-sub">短片 · 4K</div></div><span class="more"><i data-lucide="more-vertical"></i></span></div>
      </div>
      <div class="queue-foot"><i data-lucide="hard-drive"></i><span>本地媒体</span><button class="add-btn"><i data-lucide="plus"></i>添加文件</button></div>
    </aside>
  </section>
  <script>lucide.createIcons({ strokeWidth: 1.8 });</script>
</body>
</html>
